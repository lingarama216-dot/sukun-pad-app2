
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUKOON-PAD PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{color:#00f5ff;font-size:24px}
.conn-btn{padding:10px 20px;border:2px solid #00f5ff;background:transparent;color:#00f5ff;border-radius:50px;cursor:pointer}
.conn-btn.connected{border-color:#00ff00;color:#00ff00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
.zone-btn{padding:40px 10px;background:#111;border:2px solid #222;border-radius:20px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.zone-btn.active{background:#003d4d;border-color:#00f5ff}
.slider-box{background:#111;padding:20px;border-radius:20px;border:2px solid #222;margin-bottom:20px}
input[type=range]{width:100%}
.status{background:#111;padding:20px;border-radius:20px;border:2px solid #222}
.stop{background:red;color:#fff;width:100%;padding:15px;border:none;border-radius:15px;font-size:18px;margin-top:15px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>SUKOON-PAD</h1>
    <small>PRO MASSAGE SYSTEM</small>
  </div>
  <button class="conn-btn" id="connectBtn" onclick="connect()">CONNECT</button>
</div>

<div class="grid">
  <button class="zone-btn" id="HEAD" onclick="send('HEAD')">🧠<br>HEAD</button>
  <button class="zone-btn" id="BACK" onclick="send('BACK')">👤<br>BACK</button>
  <button class="zone-btn" id="LEGS" onclick="send('LEGS')">🦶<br>LEGS</button>
</div>

<div class="slider-box">
  <label>GLOBAL INTENSITY: <span id="val">50</span>%</label>
  <input type="range" id="range" min="0" max="100" value="50" oninput="updateVal()">
</div>

<div class="status">
  <h3>LIVE STATUS</h3>
  <p>Connection: <span id="status">OFFLINE</span></p>
  <p>Active Zone: <span id="zone">NONE</span></p>
  <button class="stop" onclick="send('STOP')">STOP ALL</button>
</div>

<script>
let device;
let connected = false;

async function connect(){
  try{
    device = await navigator.bluetooth.requestDevice({
      filters:[{name:'SUKOON-PAD'}]
    });
    await device.gatt.connect();
    connected = true;
    document.getElementById('connectBtn').innerText = 'CONNECTED';
    document.getElementById('connectBtn').classList.add('connected');
    document.getElementById('status').innerText = 'ONLINE';
    document.getElementById('status').style.color = '#00ff00';
  }catch(e){ alert("Connect failed") }
}

function send(zone){
  if(!connected){ alert("Pehle CONNECT karo"); return; }
  let level = document.getElementById('range').value;
  
  // Sab button se active hatao
  document.querySelectorAll('.zone-btn').forEach(b=>b.classList.remove('active'));
  if(zone != 'STOP') document.getElementById(zone).classList.add('active');
  
  document.getElementById('zone').innerText = zone;
  
  // Yahan ESP32 ko data jayega
  console.log("Sending:", zone, level);
  alert(zone + " ON at " + level + "%");
}

function updateVal(){
  document.getElementById('val').innerText = document.getElementById('range').value;
}
</script>
</body>
</html>
