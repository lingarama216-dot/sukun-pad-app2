<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUKOON-PAD PRO CONSOLE</title>
<style>
  body { background: #0a0a0a; color: #00ffff; font-family: 'Orbitron', sans-serif; margin: 0; padding: 20px; }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ffff; padding-bottom: 10px; }
  .mission-name { font-size: 24px; font-weight: bold; }
  .status-bar { display: flex; gap: 20px; align-items: center; }
  .signal { width: 20px; height: 20px; border-radius: 50%; background: red; box-shadow: 0 0 10px red; }
  .signal.online { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
  .bluetooth-icon::before { content: "📶"; } /* Bluetooth Icon */
  .wifi-icon::before { content: "📡"; } /* Wifi Icon */
  .body-map { text-align: center; margin: 20px 0; }
  .body-map img { width: 200px; filter: drop-shadow(0 0 10px #00ffff); }
  .controls { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #00ffff; }
  input[type=range] { width: 100%; }
  button { background: #00ffff; color: #000; border: none; padding: 10px 20px; margin: 5px; font-weight: bold; cursor: pointer; }
  .notes { margin-top: 20px; background: #111; padding: 15px; border-left: 3px solid #00ffff; }
</style>
</head>
<body>

<div class="header">
  <div class="mission-name">MISSION: SUKOON-PAD V1</div>
  <div class="status-bar">
    <span class="bluetooth-icon"></span>
    <span class="wifi-icon"></span>
    <span id="signal" class="signal"></span>
    <span id="statusText">OFFLINE</span>
  </div>
</div>

<div class="body-map">
  <h2>SELECT BODY PART</h2>
  <img src="https://i.imgur.com/8KmNp3b.png" alt="Body Outline"> <!-- Body ki photo -->
</div>

<div class="controls">
  <h3>CONTROL PANEL</h3>
  <label>Power: <input type="range" id="power" min="0" max="100" value="50"></label> <span id="pVal">50%</span><br>
  <label>Speed: <input type="range" id="speed" min="1" max="5" value="3"></label> <span id="sVal">3</span><br>
  <label>Mode: 
    <select id="mode">
      <option>Knock</option>
      <option>Vibration</option>
      <option>Heat</option>
      <option>Auto</option>
    </select>
  </label><br><br>
  <button id="connectBtn">CONNECT</button>
  <button id="startBtn">START</button>
  <button id="stopBtn">STOP</button>
</div>

<div class="notes">
  <h3>📝 USAGE NOTES</h3>
  <b>HEAD:</b> Sar ke pichhe 10 min <br>
  <b>BACK:</b> Reedh ke dono taraf 15 min <br>
  <b>LEGS:</b> Pindli aur talwe 20 min
</div>

<script>
let device, server, characteristic;
const signal = document.getElementById('signal');
const statusText = document.getElementById('statusText');

document.getElementById('connectBtn').onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{name: 'SUKOON-PAD'}],
      optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
    });
    server = await device.gatt.connect();
    signal.classList.add('online');
    statusText.innerText = "ONLINE";
  } catch(e) {
    signal.classList.remove('online');
    statusText.innerText = "OFFLINE";
  }
}

// Slider value update
document.getElementById('power').oninput = e => document.getElementById('pVal').innerText = e.target.value + '%';
document.getElementById('speed').oninput = e => document.getElementById('sVal').innerText = e.target.value;
</script>
</body>
  </html>
